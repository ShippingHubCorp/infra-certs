name: Daily Terraform Apply

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC daily
  workflow_dispatch:  # Allows manual triggering

permissions:
  id-token: write
  contents: write  # keep-alive commit (see last step)

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::247253258013:role/github-actions-role-infra_certs
          aws-region: us-east-1

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0  # Adjust as needed

      - name: Initialize Terraform
        run: terraform init

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve

      # GitHub disables scheduled workflows after 60 days without a push to the
      # repository. That happened on 2026-06-30 and both wildcard certs expired
      # on 2026-09-27. If the last commit is older than 45 days, push a marker
      # commit so the schedule never goes dormant.
      - name: Keep scheduled workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit is ${age_days} days old"
          if [ "$age_days" -lt 45 ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflow alive"
          git push origin HEAD:${{ github.ref_name }}
